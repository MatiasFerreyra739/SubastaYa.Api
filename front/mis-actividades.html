<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa — Mis actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container py-4">
        <h1 class="mb-4"><i class="bi bi-person-badge"></i> Mis actividades</h1>

        <ul class="nav nav-tabs mb-3" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-compras">
                    <i class="bi bi-bag"></i> Mis compras / pujas
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-publicaciones">
                    <i class="bi bi-megaphone"></i> Mis publicaciones
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-compras">
                <div id="loader-compras" class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                </div>
                <div id="lista-compras" class="row g-3"></div>
            </div>
            <div class="tab-pane fade" id="tab-publicaciones">
                <div id="loader-publicaciones" class="text-center py-4">
                    <div class="spinner-border text-primary"></div>
                </div>
                <div id="lista-publicaciones" class="row g-3"></div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/mis-actividades.js"></script>
</body>
</html>
