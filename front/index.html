<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa — Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container py-4">
        <h1 class="mb-4">Subastas disponibles</h1>

        <!-- Filtros -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12 col-md-3">
                        <label class="form-label small">Estado</label>
                        <select id="filtro-estado" class="form-select">
                            <option value="">Todos</option>
                            <option value="ACTIVA">Activas</option>
                            <option value="PROGRAMADA">Próximas</option>
                            <option value="FINALIZADA">Finalizadas</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label small">Categoría</label>
                        <select id="filtro-categoria" class="form-select">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small">Precio mín.</label>
                        <input type="number" id="filtro-precio-min" class="form-control" min="0">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label small">Precio máx.</label>
                        <input type="number" id="filtro-precio-max" class="form-control" min="0">
                    </div>
                    <div class="col-12 col-md-2">
                        <label class="form-label small">Ordenar por</label>
                        <select id="filtro-orden" class="form-select">
                            <option value="tiempo">Menor tiempo restante</option>
                            <option value="puja">Mayor puja</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando subastas…</p>
        </div>

        <!-- Grid de cards -->
        <div id="grid-subastas" class="row g-4"></div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <p class="mt-3 text-muted">No hay subastas con esos filtros.</p>
        </div>
    </main>

    <!-- Container de toasts -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
