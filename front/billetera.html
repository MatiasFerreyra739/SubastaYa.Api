<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa — Billetera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container py-4">
        <h1 class="mb-4"><i class="bi bi-wallet2"></i> Mi billetera</h1>

        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Saldo Total</p>
                                <h3 class="mb-0 text-primary" id="saldo-total">—</h3>
                            </div>
                            <i class="bi bi-cash-stack display-5 text-primary"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Retenido en garantía</p>
                                <h3 class="mb-0 text-warning" id="saldo-retenido">—</h3>
                            </div>
                            <i class="bi bi-lock-fill display-5 text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted mb-1 small">Disponible</p>
                                <h3 class="mb-0 text-success" id="saldo-disponible">—</h3>
                            </div>
                            <i class="bi bi-check-circle-fill display-5 text-success"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Cargar saldo</h5>
                <p class="text-muted small">Acreditá saldo simulado a tu billetera.</p>
                <form id="form-deposito" class="row g-2 align-items-end">
                    <div class="col-12 col-md-4">
                        <label class="form-label small">Monto</label>
                        <input type="number" id="monto-deposito" class="form-control" min="1" step="any" required>
                    </div>
                    <div class="col-12 col-md-3">
                        <button type="submit" class="btn btn-success w-100" id="btn-depositar">
                            <i class="bi bi-plus-circle"></i> Depositar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Historial de movimientos</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Tipo</th>
                                <th>Subasta</th>
                                <th class="text-end">Monto</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-movimientos">
                            <tr><td colspan="4" class="text-center text-muted py-4">Cargando…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/billetera.js"></script>
</body>
</html>
